<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun &amp; Moon | Theme Toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Loaded in <head> without defer so the saved theme is applied before first paint (no flash) -->
  <script src="script.js"></script>
</head>
<body>
  <main class="stage">
    <h1 class="title">Day or night,<br>your call.</h1>
    <p class="lead">Flip the switch and every color on the page follows. We remember your choice for next time.</p>

    <button id="themeToggle" class="toggle" type="button" role="switch"
            aria-checked="false" aria-label="Switch to dark mode">
      <span class="sky">
        <span class="stars">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="clouds">
          <b class="cloud c1"></b><b class="cloud c2"></b>
        </span>
      </span>
      <span class="knob">
        <svg class="icon sun" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="9" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/>
          </g>
        </svg>
        <svg class="icon moon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M33 30.5A14 14 0 0 1 17.5 15a14 14 0 1 0 15.5 15.5z" fill="currentColor"/>
          <circle cx="29" cy="14" r="1.6" fill="currentColor"/>
          <circle cx="36" cy="22" r="1.1" fill="currentColor"/>
        </svg>
      </span>
    </button>

    <p class="status" aria-live="polite"><span id="modeLabel">Light mode</span> is on and saved on this device.</p>

    <section class="preview" aria-label="Theme preview">
      <div class="preview-head">
        <span class="dot"></span>
        <strong>Saturday hike</strong>
      </div>
      <p>Trail opens at 6:30. Bring water and a jacket for the ridge.</p>
      <div class="bar"><span></span></div>
      <button class="cta" type="button">Add to calendar</button>
    </section>
  </main>
</body>
</html>
